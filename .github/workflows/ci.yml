name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.22", "stable"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
      - name: Vet and format
        run: make vet
      - name: Tests
        run: go test ./...
      - name: Race detector (real server, transport, client)
        run: make race
      - name: Chaos sweep (2000 seeds)
        run: make chaos SEEDS=2000
